<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>金融销售电话质检系统</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>金融销售电话质检系统（离线）</h1>
      <p>上传录音文件后执行离线转写 + 说话人分离，输出可用于 sales/customer 对话分析的日志。</p>

      <form id="job-form">
        <label>上传录音（支持多文件）</label>
        <input type="file" id="files" name="files" multiple required />

        <label>说话人分离方案</label>
        <select id="diarization" name="diarization">
          <option value="campp" selected>FunASR CAM++</option>
          <option value="pyannote">pyannote.audio</option>
        </select>

        <label>相邻同 speaker 合并阈值（字符）</label>
        <input type="number" id="merge_threshold_chars" name="merge_threshold_chars" value="12" min="1" max="100" />

        <label>热词（空格分隔）</label>
        <input type="text" id="hotwords" name="hotwords" placeholder="基金 理财 赎回" />

        <button type="submit">开始离线质检</button>
      </form>
    </section>

    <section class="card">
      <h2>任务状态</h2>
      <pre id="status">尚未开始</pre>
    </section>

    <section class="card">
      <h2>说话人日志</h2>
      <pre id="result">等待结果...</pre>
    </section>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
